name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  XYNIGO_RELEASE_CHANNEL: test

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    env:
      XYNIGO_PROXY_LINK: https://proxy.example.test/{region}
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/audit_public_release.py

  windows-updater:
    runs-on: windows-latest
    env:
      XYNIGO_PROXY_LINK: https://proxy.example.test/{region}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v

  windows-standard-installer:
    runs-on: windows-latest
    env:
      XYNIGO_RELEASE_CHANNEL: test
      XYNIGO_PROXY_LINK: https://proxy.example.test/{region}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache-dependency-path: packaging/windows/launcher/go.sum
      - name: Test Windows status-center state rendering
        working-directory: packaging/windows/launcher
        run: go test ./...
      - run: choco install nsis --version=3.12.0 -y --no-progress
      - name: Build standard installer
        shell: bash
        env:
          NSIS_WINDOWS_PATH: C:\Program Files (x86)\NSIS\makensis.exe
        run: |
          export XYNIGO_MAKENSIS_BIN="$(cygpath -u "$NSIS_WINDOWS_PATH")"
          bash 组装Windows标准安装包.sh
      - name: Verify per-user install, upgrade and safe uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-Item "dist\Xynigo_Sourcing_Windows_Setup_v*.exe"
          $installDir = Join-Path $env:LOCALAPPDATA "Programs\Xynigo Sourcing"
          $greenDir = Join-Path $env:RUNNER_TEMP "Xynigo green source"
          # Reproduce the v0.12.7 hotfix incident: an existing same-version
          # runtime must not be reused when the package payload has changed.
          New-Item -ItemType Directory -Force -Path "$installDir\versions\0.12.7" | Out-Null
          Set-Content -Path "$installDir\current-version.txt" -Value '0.12.7' -Encoding ASCII
          Set-Content -Path "$installDir\versions\0.12.7\stale-runtime.txt" -Value 'old payload' -Encoding ASCII
          New-Item -ItemType Directory -Force -Path "$greenDir\运行数据" | Out-Null
          Set-Content -Path "$greenDir\VERSION.json" -Value '{"version":"0.12.4"}' -Encoding UTF8
          Set-Content -Path "$greenDir\config.json" -Value '{"keep":true}' -Encoding UTF8
          Set-Content -Path "$greenDir\运行数据\keep.txt" -Value 'keep' -Encoding UTF8
          $installArgs = "/S /MIGRATEDIR=`"$greenDir`""
          $installerProcess = Start-Process -FilePath $installer.FullName -ArgumentList $installArgs -Wait -PassThru
          if ($installerProcess.ExitCode -ne 0) { throw "installer failed: $($installerProcess.ExitCode)" }
          if (-not (Test-Path "$installDir\Xynigo.cmd")) { throw "standard launcher missing" }
          if (-not (Test-Path "$installDir\Xynigo.exe")) { throw "tray/status launcher missing" }
          if (-not (Test-Path "$installDir\xynigo-logo.png")) { throw "brand asset missing" }
          if (-not (Test-Path "$installDir\current-version.txt")) { throw "version marker missing" }
          $runtimeId = (Get-Content "$installDir\current-version.txt" -Raw).Trim()
          if ($runtimeId -eq '0.12.7') { throw "same-version stale runtime remained active" }
          $runtimeDir = Join-Path "$installDir\versions" $runtimeId
          if (-not (Test-Path "$runtimeDir\app\purchase_tool\workspace_rpc.py")) { throw "workspace RPC runtime missing" }
          $channelSource = Get-Content "$runtimeDir\app\purchase_tool\executor_channel.py" -Raw
          if ($channelSource -notmatch 'workspace\.rpc\.v1') { throw "workspace RPC capability missing" }
          # Reproduce an upgrade where the previous launcher exited but its
          # Python executor remained alive. The new status center must replace
          # only the orphan under this installation root and start its own child.
          $env:XYNIGO_DATA_DIR = $installDir
          $env:XYNIGO_INSTALL_DIR = $installDir
          $env:XYNIGO_INSTALL_MODE = 'standard'
          $env:XYNIGO_LAUNCHER_TOKEN = ('legacy-' + ('x' * 40))
          $pythonw = Join-Path $runtimeDir 'python-embed\pythonw.exe'
          $runPy = Join-Path $runtimeDir 'run.py'
          $orphanArgs = ('"{0}" --no-browser' -f $runPy)
          $orphan = Start-Process -FilePath $pythonw -ArgumentList $orphanArgs -PassThru
          $orphanReady = $false
          for ($attempt = 0; $attempt -lt 20; $attempt++) {
            if ($orphan.HasExited) { break }
            try {
              $status = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:8765/executor-status.json' -TimeoutSec 1
              if ($status.StatusCode -eq 200) { $orphanReady = $true; break }
            } catch {
              Start-Sleep -Milliseconds 500
            }
          }
          if ($orphan.HasExited) { throw "orphan executor setup failed: $($orphan.ExitCode)" }
          if (-not $orphanReady) { throw "orphan executor did not expose its status endpoint" }
          $orphanPid = $orphan.Id

          $launcher = Start-Process -FilePath "$installDir\Xynigo.exe" -ArgumentList "--background" -PassThru
          for ($attempt = 0; $attempt -lt 20; $attempt++) {
            $orphan.Refresh()
            if ($orphan.HasExited) { break }
            Start-Sleep -Milliseconds 500
          }
          if ($launcher.HasExited) { throw "tray/status launcher exited during startup: $($launcher.ExitCode)" }
          if (-not $orphan.HasExited) {
            $statusLog = Join-Path $installDir '日志\状态中心.log'
            if (Test-Path $statusLog) { Get-Content $statusLog | Write-Host }
            Get-NetTCPConnection -State Listen -LocalPort 8765 -ErrorAction SilentlyContinue |
              Format-List LocalAddress,LocalPort,OwningProcess | Out-String | Write-Host
            throw "new launcher did not replace orphan executor PID $orphanPid"
          }
          $managedPids = @()
          for ($attempt = 0; $attempt -lt 20; $attempt++) {
            $managedPids = @()
            $listeners = @(Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object {
              $_.LocalAddress -eq '127.0.0.1' -and $_.LocalPort -ge 8765 -and $_.LocalPort -le 8774
            })
            foreach ($listener in $listeners) {
              try {
                $candidateStatus = Invoke-RestMethod -Uri "http://127.0.0.1:$($listener.LocalPort)/executor-status.json" -TimeoutSec 1
                if ($candidateStatus.schemaVersion -eq 1 -and $candidateStatus.version) {
                  $managedPids += @($listener.OwningProcess)
                }
              } catch {}
            }
            $managedPids = @($managedPids | Sort-Object -Unique)
            if ($managedPids.Count -eq 1 -and $managedPids[0] -ne $orphanPid) { break }
            Start-Sleep -Milliseconds 500
          }
          if ($managedPids.Count -ne 1) {
            $statusLog = Join-Path $installDir '日志\状态中心.log'
            $executorLog = Join-Path $installDir '日志\本地执行器.log'
            if (Test-Path $statusLog) { Get-Content $statusLog | Write-Host }
            if (Test-Path $executorLog) { Get-Content $executorLog -Tail 80 | Write-Host }
            throw "expected exactly one status listener, found $($managedPids.Count)"
          }
          if ($managedPids[0] -eq $orphanPid) { throw "launcher adopted the orphan executor" }
          & taskkill.exe /PID $launcher.Id /T /F | Out-Null
          $protocol = (Get-Item "HKCU:\Software\Classes\xynigo\shell\open\command").GetValue('')
          if ($protocol -notmatch 'Xynigo\.exe.*--protocol') { throw "xynigo protocol missing" }
          if (-not (Test-Path "$installDir\config.json")) { throw "green config was not migrated" }
          if (-not (Test-Path "$installDir\运行数据\keep.txt")) { throw "green runtime data was not migrated" }
          # Exercise the standard-package online handoff: the installer stops
          # the launcher without killing itself, switches the immutable
          # runtime pointer, and starts a fresh status center.
          $onlineLauncher = Start-Process -FilePath "$installDir\Xynigo.exe" -ArgumentList "--background" -PassThru
          $onlineChildren = @()
          for ($attempt = 0; $attempt -lt 20; $attempt++) {
            $onlineChildren = @(Get-CimInstance Win32_Process -Filter "Name = 'pythonw.exe'" | Where-Object {
              $_.ExecutablePath -and $_.ExecutablePath -like "$runtimeDir\*"
            })
            if ($onlineChildren.Count -eq 1) { break }
            Start-Sleep -Milliseconds 500
          }
          if ($onlineChildren.Count -ne 1) { throw "online executor child did not start" }
          # The real updater spawns the installer and then exits its own Python
          # process. Reproduce that handoff while leaving Xynigo.exe alive for
          # the installer's online-mode process switch.
          Stop-Process -Id $onlineChildren[0].ProcessId -Force
          # Do not use Start-Process -Wait here: on Windows PowerShell it also
          # waits for the status-center descendant intentionally started by
          # .onInstSuccess. Wait only for the installer process itself.
          $upgrade = Start-Process -FilePath $installer.FullName -ArgumentList "/S /ONLINEUPDATE=1" -PassThru
          if (-not $upgrade.WaitForExit(60000)) {
            Stop-Process -Id $upgrade.Id -Force -ErrorAction SilentlyContinue
            throw "online reinstall timed out"
          }
          $upgrade.Refresh()
          if ($upgrade.ExitCode -ne 0) { throw "online reinstall failed: $($upgrade.ExitCode)" }
          $onlineRestarted = $false
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            $statusCenters = @(Get-Process -Name Xynigo -ErrorAction SilentlyContinue)
            if ($statusCenters.Count -eq 1 -and $statusCenters[0].Id -ne $onlineLauncher.Id) {
              $onlineRestarted = $true
              break
            }
            Start-Sleep -Milliseconds 500
          }
          if (-not $onlineRestarted) { throw "online installer did not restart the status center" }
          if (-not (Test-Path "$installDir\config.json")) { throw "upgrade removed config" }
          if (-not (Test-Path "$installDir\运行数据\keep.txt")) { throw "upgrade removed runtime data" }
          & taskkill.exe /IM Xynigo.exe /T /F | Out-Null
          Start-Sleep -Milliseconds 800
          $uninstaller = Get-Item "$installDir\卸载 Xynigo Sourcing.exe"
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList "/S" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "uninstall failed: $($uninstall.ExitCode)" }
          Start-Sleep -Seconds 1
          if (Test-Path "$installDir\versions") { throw "uninstall kept managed versions" }
          if (-not (Test-Path "$installDir\config.json")) { throw "uninstall removed config" }
          if (-not (Test-Path "$installDir\运行数据\keep.txt")) { throw "uninstall removed runtime data" }
          if (Test-Path "HKCU:\Software\Classes\xynigo") { throw "protocol registration remained" }
      - uses: actions/upload-artifact@v7
        with:
          name: xynigo-sourcing-windows-standard-installer
          path: |
            dist/Xynigo_Sourcing_Windows_Setup_v*.exe
            dist/Xynigo_Sourcing_Windows_Setup_v*.json
            dist/Xynigo_Sourcing_Windows_Setup_v*.sha256
          if-no-files-found: error

  macos-package:
    runs-on: macos-15
    env:
      XYNIGO_PROXY_LINK: https://proxy.example.test/{region}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/audit_public_release.py
      - run: bash 组装macOS绿色包.sh
      - run: bash 组装macOS标准安装包.sh
      - name: Verify macOS package
        env:
          EXPECTED_PLATFORM: macos-arm64
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import tempfile
          import zipfile

          manifest_path = next(Path('dist').glob('*_update.json'))
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          package = manifest['platforms'][os.environ['EXPECTED_PLATFORM']]
          archive = Path('dist') / package['assetName']
          assert archive.is_file()
          with tempfile.TemporaryDirectory() as tmp:
              with zipfile.ZipFile(archive) as bundle:
                  names = set(bundle.namelist())
                  assert 'Xynigo-Sourcing/VERSION.json' in names
                  assert 'Xynigo-Sourcing/update-helper.sh' in names
                  assert 'Xynigo-Sourcing/启动-Mac.command' in names
                  assert 'Xynigo-Sourcing/启动-本地执行器-Mac.command' in names
                  assert not any(name.endswith('/config.json') for name in names)
                  bundle.extractall(tmp)
              root = Path(tmp) / 'Xynigo-Sourcing'
              info = json.loads((root / 'VERSION.json').read_text(encoding='utf-8'))
              assert info['platform'] == os.environ['EXPECTED_PLATFORM']
              binary = root / 'runtime' / 'xynigo-sourcing'
              binary.chmod(0o755)
              import subprocess
              output = subprocess.check_output(
                  [str(binary), '--package-self-test'], text=True)
              assert os.environ['EXPECTED_PLATFORM'] in output
              cloud_output = subprocess.check_output(
                  [str(binary), '--cloud-tls-self-test'], text=True,
                  timeout=30)
              assert 'cloud TLS self-test OK' in cloud_output
          PY
      - name: Verify macOS standard app and installer payload
        run: |
          set -euo pipefail
          package="$(find dist -maxdepth 1 -name 'Xynigo_Sourcing_macOS_Standard_v*.pkg' -print -quit)"
          test -n "$package"
          payload_list="$RUNNER_TEMP/xynigo-standard-payload.txt"
          pkgutil --payload-files "$package" > "$payload_list"
          grep -Fq 'Applications/Xynigo Sourcing.app/Contents/MacOS/xynigo-launcher' "$payload_list"
          grep -Fq 'Applications/Xynigo Sourcing.app/Contents/Resources/runtime/xynigo-sourcing' "$payload_list"
          if grep -Eiq 'LaunchAgents|LaunchDaemons|LoginItems' "$payload_list"; then
            echo 'unexpected autostart payload' >&2
            exit 1
          fi
          expanded="$RUNNER_TEMP/xynigo-standard-expanded"
          pkgutil --expand-full "$package" "$expanded"
          app="$(find "$expanded" -type d -name 'Xynigo Sourcing.app' -print -quit)"
          test -n "$app"
          codesign --verify --deep --strict "$app"
          test "$(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")" = 'icu.samforo.xynigo.sourcing'
          plutil -p "$app/Contents/Info.plist" | grep -Fq 'xynigo'
          python - <<'PY'
          import json
          from pathlib import Path

          metadata_path = next(Path('dist').glob(
              'Xynigo_Sourcing_macOS_Standard_v*.json'))
          metadata = json.loads(metadata_path.read_text(encoding='utf-8'))
          assert metadata['installMode'] == 'standard_system_application'
          assert metadata['dataDirectory'].endswith('XynigoSourcing')
          assert metadata['autoStart'] is False
          assert metadata['developerIdApplicationSigned'] is False
          assert metadata['developerIdInstallerSigned'] is False
          assert metadata['notarized'] is False
          assert metadata['releaseEligible'] is False
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: xynigo-sourcing-macos-arm64
          path: dist/*
          if-no-files-found: error

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: packaging/windows/launcher/go.sum
      - run: bash 组装Windows绿色包.sh
      - run: python scripts/audit_public_release.py
      - name: Verify release assets
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import zipfile

          manifest_path = next(Path('dist').glob('*_update.json'))
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          archive = Path('dist') / manifest['assetName']
          assert archive.is_file()
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == manifest['sha256']
          with zipfile.ZipFile(archive) as bundle:
              names = set(bundle.namelist())
              assert 'Xynigo-Sourcing/VERSION.json' in names
              assert 'Xynigo-Sourcing/update-helper.ps1' in names
              assert 'Xynigo-Sourcing/启动-本地执行器.bat' in names
              assert 'Xynigo-Sourcing/Xynigo.exe' in names
              assert 'Xynigo-Sourcing/xynigo-logo.png' in names
              assert 'Xynigo-Sourcing/xynigo-x.ico' in names
              assert not any(name.endswith('/config.json') for name in names)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: xynigo-sourcing-windows-x86_64
          path: dist/*
          if-no-files-found: error
