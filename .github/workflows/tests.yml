name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  XYNIGO_RELEASE_CHANNEL: test

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    env:
      XYNIGO_PROXY_LINK: https://proxy.example.test/{region}
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/audit_public_release.py

  windows-updater:
    runs-on: windows-latest
    env:
      XYNIGO_PROXY_LINK: https://proxy.example.test/{region}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v

  macos-package:
    runs-on: macos-15
    env:
      XYNIGO_PROXY_LINK: https://proxy.example.test/{region}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/audit_public_release.py
      - run: bash 组装macOS绿色包.sh
      - name: Verify macOS package
        env:
          EXPECTED_PLATFORM: macos-arm64
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import tempfile
          import zipfile

          manifest_path = next(Path('dist').glob('*_update.json'))
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          package = manifest['platforms'][os.environ['EXPECTED_PLATFORM']]
          archive = Path('dist') / package['assetName']
          assert archive.is_file()
          with tempfile.TemporaryDirectory() as tmp:
              with zipfile.ZipFile(archive) as bundle:
                  names = set(bundle.namelist())
                  assert 'Xynigo-Sourcing/VERSION.json' in names
                  assert 'Xynigo-Sourcing/update-helper.sh' in names
                  assert 'Xynigo-Sourcing/启动-Mac.command' in names
                  assert 'Xynigo-Sourcing/启动-本地执行器-Mac.command' in names
                  assert not any(name.endswith('/config.json') for name in names)
                  bundle.extractall(tmp)
              root = Path(tmp) / 'Xynigo-Sourcing'
              info = json.loads((root / 'VERSION.json').read_text(encoding='utf-8'))
              assert info['platform'] == os.environ['EXPECTED_PLATFORM']
              binary = root / 'runtime' / 'xynigo-sourcing'
              binary.chmod(0o755)
              import subprocess
              output = subprocess.check_output(
                  [str(binary), '--package-self-test'], text=True)
              assert os.environ['EXPECTED_PLATFORM'] in output
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: xynigo-sourcing-macos-arm64
          path: dist/*
          if-no-files-found: error

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: bash 组装Windows绿色包.sh
      - run: python scripts/audit_public_release.py
      - name: Verify release assets
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import zipfile

          manifest_path = next(Path('dist').glob('*_update.json'))
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          archive = Path('dist') / manifest['assetName']
          assert archive.is_file()
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == manifest['sha256']
          with zipfile.ZipFile(archive) as bundle:
              names = set(bundle.namelist())
              assert 'Xynigo-Sourcing/VERSION.json' in names
              assert 'Xynigo-Sourcing/update-helper.ps1' in names
              assert 'Xynigo-Sourcing/启动-本地执行器.bat' in names
              assert not any(name.endswith('/config.json') for name in names)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: xynigo-sourcing-windows-x86_64
          path: dist/*
          if-no-files-found: error
