<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    *{box-sizing:border-box}html,body{width:164px;height:314px;margin:0;overflow:hidden}
    body{position:relative;background:linear-gradient(160deg,#09284c 0%,#0c4669 48%,#15949b 100%);font-family:"Microsoft YaHei UI","PingFang SC",sans-serif;color:#fff}
    .glow{position:absolute;border-radius:50%;filter:blur(1px);background:rgba(255,255,255,.09)}
    .g1{width:136px;height:136px;right:-70px;top:-45px}.g2{width:105px;height:105px;left:-56px;bottom:14px}
    .mark{position:absolute;left:18px;top:22px;width:64px;height:64px;padding:9px;border:1px solid rgba(255,255,255,.23);border-radius:18px;background:rgba(255,255,255,.11)}
    .mark img{width:100%;height:100%;display:block}
    .name{position:absolute;left:18px;top:103px;font-size:22px;line-height:1;font-weight:900;letter-spacing:.02em}
    .kind{position:absolute;left:19px;top:134px;color:#c6f4f1;font-size:8px;font-weight:800;letter-spacing:.16em}
    .rule{position:absolute;left:18px;top:160px;width:54px;height:3px;border-radius:999px;background:linear-gradient(90deg,#2cc7c5,#ff765c)}
    .copy{position:absolute;left:18px;right:16px;top:180px;font-size:12px;line-height:1.6;font-weight:800}
    .copy small{display:block;margin-top:8px;color:#c8dce7;font-size:8px;line-height:1.55;font-weight:500}
    .steps{position:absolute;left:18px;bottom:20px;color:#cfe7ee;font-size:7px;font-weight:800;letter-spacing:.08em}
  </style>
</head>
<body>
  <span class="glow g1"></span><span class="glow g2"></span>
  <div class="mark"><img src="../../../src/purchase_tool/web/xynigo-x.png" alt="X"></div>
  <div class="name">Xynigo</div>
  <div class="kind">SOURCING EXECUTOR</div>
  <div class="rule"></div>
  <div class="copy">连接云端工作台<br>与这台采购电脑
    <small>状态中心 · 系统托盘<br>设备配对 · 安全执行</small>
  </div>
  <div class="steps">DOWNLOAD · INSTALL · CONNECT</div>
</body>
</html>
