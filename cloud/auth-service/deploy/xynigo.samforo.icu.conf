limit_req_zone $binary_remote_addr zone=xynigo_auth_start:10m rate=10r/m;

server {
    listen 80;
    server_name xynigo.samforo.icu;

    root /www/wwwroot/xynigo.samforo.icu;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }

    access_log /www/wwwlogs/xynigo.samforo.icu.log;
    error_log /www/wwwlogs/xynigo.samforo.icu.error.log;
}

server {
    listen 443 ssl http2;
    server_name xynigo.samforo.icu;

    ssl_certificate /etc/letsencrypt/live/xynigo.samforo.icu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xynigo.samforo.icu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 1m;

    location = /v1/assistant/procurement-import/parse {
        # The API contract accepts one base64-encoded xlsx up to 20 MiB.
        # Keep the larger body allowance scoped to this authenticated route.
        client_max_body_size 30m;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    location ~ "^/v1/executors/[0-9a-f-]{36}/workspace-rpc$" {
        # Buyer-account workbooks travel as encrypted executor task payloads.
        client_max_body_size 40m;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    location ~ "^/v1/executor-channel/tasks/[0-9a-f-]{36}/finish$" {
        # Binary exports return through an encrypted result envelope.
        client_max_body_size 60m;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    location = /v1/auth/local/start {
        limit_req zone=xynigo_auth_start burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    add_header Strict-Transport-Security "max-age=86400" always;

    access_log /www/wwwlogs/xynigo.samforo.icu.log;
    error_log /www/wwwlogs/xynigo.samforo.icu.error.log;
}
