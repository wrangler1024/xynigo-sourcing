server {
    listen 80;
    server_name xynigo.samforo.icu;

    root /www/wwwroot/xynigo.samforo.icu;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }

    access_log /www/wwwlogs/xynigo.samforo.icu.log;
    error_log /www/wwwlogs/xynigo.samforo.icu.error.log;
}

server {
    listen 443 ssl http2;
    server_name xynigo.samforo.icu;

    ssl_certificate /etc/letsencrypt/live/xynigo.samforo.icu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xynigo.samforo.icu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    add_header Strict-Transport-Security "max-age=86400" always;

    access_log /www/wwwlogs/xynigo.samforo.icu.log;
    error_log /www/wwwlogs/xynigo.samforo.icu.error.log;
}
