[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xynigo-sourcing"
version = "0.13.5"
description = "Open-source sourcing orchestration for cross-border ecommerce teams"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Xynigo contributors" }]
dependencies = [
  "certifi>=2024.8.30,<2027",
  "openpyxl>=3.1,<4",
  "websocket-client>=1.6,<2",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/wrangler1024/xynigo-sourcing"
Issues = "https://github.com/wrangler1024/xynigo-sourcing/issues"

[project.scripts]
xynigo-sourcing = "purchase_tool.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
purchase_tool = ["web/*"]
